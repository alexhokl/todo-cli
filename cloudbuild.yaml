logsBucket: "gs://craffy-build-logs"

options:
  machineType: E2_HIGHCPU_8 # 8 vCPU
  logging: GCS_ONLY

timeout: "1200s" # 20 minutes

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build
    waitFor: ["-"]
    args:
      - "build"
      - "--build-arg"
      - "GIT_TAG=$TAG_NAME"
      - "--build-arg"
      - "GIT_COMMIT=$SHORT_SHA"
      - "-t"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/public/todo-cli:$TAG_NAME"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push to Container registry
    waitFor: [Build]
    args:
      - "push"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/public/todo-cli:$TAG_NAME"
