syntax = "proto3";

package item;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alexhokl/todo-cli/proto";

// ItemService is the gRPC API served by `todo serve`. RPCs are added here and
// registered in cmd/serve.go.
service ItemService {
  // ListItems returns the active items in their manual order along with the
  // completed items ordered by how recently they were updated.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  // CreateItem appends a new item to the end of the manual order.
  rpc CreateItem(CreateItemRequest) returns (Item);
  // MoveItem places an item immediately before or after another item and
  // optionally reassigns its list in the same operation.
  rpc MoveItem(MoveItemRequest) returns (Item);
  // SetItemDone completes or reopens an item. Completing removes it from the
  // manual order; reopening appends it to the end.
  rpc SetItemDone(SetItemDoneRequest) returns (Item);
  // UpdateItemLabels attaches and detaches labels on an item. Labels being
  // added are created on the fly when they do not exist yet.
  rpc UpdateItemLabels(UpdateItemLabelsRequest) returns (Item);

  // ListLabels returns every known label ordered by name.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  // CreateLabel creates a label explicitly and reports a name that is already
  // taken rather than returning the existing label.
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  // RenameLabel changes the name of an existing label.
  rpc RenameLabel(RenameLabelRequest) returns (Label);
  // DeleteLabel removes a label that is no longer attached to any item.
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty);
}

// Label is a tag that can be attached to any number of items. Names are
// normalised to lower case with surrounding whitespace removed.
message Label {
  uint32 id = 1;
  string name = 2;
}

// Item is a single todo item.
message Item {
  uint32 id = 1;
  string title = 2;
  string description = 3;
  bool done = 4;
  optional google.protobuf.Timestamp due_date = 5;
  optional uint32 list_id = 6;
  // position is the manual ordering rank. It is set only while done is false.
  optional double position = 7;
  repeated Label labels = 8;
}

// ItemView narrows ListItems to a single bucket. ITEM_VIEW_UNSPECIFIED keeps
// the legacy behaviour of returning both active and completed items.
enum ItemView {
  ITEM_VIEW_UNSPECIFIED = 0;
  // UNTRIAGED: not done and carrying no manual ordering rank yet.
  ITEM_VIEW_UNTRIAGED = 1;
  // TRIAGED: not done and already placed in the manual order.
  ITEM_VIEW_TRIAGED = 2;
  // TIME_SENSITIVE: not done and carrying a due date.
  ITEM_VIEW_TIME_SENSITIVE = 3;
  // DONE: completed items.
  ITEM_VIEW_DONE = 4;
}

message ListItemsRequest {
  // labels restricts the result to items carrying every one of these labels.
  // An unknown name therefore yields no results.
  repeated string labels = 1;
  // view narrows the result to a single bucket. Leaving it unset returns both
  // the active and completed items as before.
  ItemView view = 2;
}

message ListItemsResponse {
  // active holds the items that are not yet done, in manual order.
  repeated Item active = 1;
  // completed holds the done items, most recently updated first.
  repeated Item completed = 2;
}

message CreateItemRequest {
  string title = 1;
  string description = 2;
  optional google.protobuf.Timestamp due_date = 3;
  optional uint32 list_id = 4;
  // labels are created on the fly when they do not exist yet.
  repeated string labels = 5;
}

message MoveItemRequest {
  uint32 id = 1;
  // Exactly one anchor must be supplied.
  oneof anchor {
    // before_id places the item immediately before the identified item.
    uint32 before_id = 2;
    // after_id places the item immediately after the identified item.
    uint32 after_id = 3;
  }
  // change_list reports whether list_id should be applied. It distinguishes
  // leaving the list untouched from clearing it.
  bool change_list = 4;
  // list_id is applied only when change_list is true. Leaving it unset while
  // change_list is true detaches the item from its list.
  optional uint32 list_id = 5;
}

message SetItemDoneRequest {
  uint32 id = 1;
  bool done = 2;
}

message UpdateItemLabelsRequest {
  uint32 id = 1;
  // add names labels to attach, creating any that do not exist yet.
  repeated string add = 2;
  // remove names labels to detach. Names that are not known labels are
  // ignored rather than being created only to be detached again.
  repeated string remove = 3;
}

message ListLabelsRequest {}

message ListLabelsResponse {
  repeated Label labels = 1;
}

message CreateLabelRequest {
  string name = 1;
}

message RenameLabelRequest {
  uint32 id = 1;
  string name = 2;
}

message DeleteLabelRequest {
  uint32 id = 1;
}