syntax = "proto3";

package item;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alexhokl/todo-cli/proto";

// ItemService is the gRPC API served by `todo serve`. RPCs are added here and
// registered in cmd/serve.go.
service ItemService {
  // ListItems returns the active items in their manual order along with the
  // completed items ordered by how recently they were updated.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  // CreateItem appends a new item to the end of the manual order.
  rpc CreateItem(CreateItemRequest) returns (Item);
  // MoveItem places an item immediately before or after another item and
  // optionally reassigns its list in the same operation.
  rpc MoveItem(MoveItemRequest) returns (Item);
  // SetItemDone completes or reopens an item. Completing removes it from the
  // manual order; reopening appends it to the end.
  rpc SetItemDone(SetItemDoneRequest) returns (Item);
  // UpdateItemLabels attaches and detaches labels on an item. Labels being
  // added are created on the fly when they do not exist yet.
  rpc UpdateItemLabels(UpdateItemLabelsRequest) returns (Item);
  // UpdateItemLinks attaches and detaches links between an item and other
  // items. The relationship is symmetric: linking A to B also links B to A.
  rpc UpdateItemLinks(UpdateItemLinksRequest) returns (Item);
  // SetItemEffort attaches an effort to an item by name, or clears it when the
  // name is empty. The effort must already exist; unknown names are reported.
  rpc SetItemEffort(SetItemEffortRequest) returns (Item);

  // ListLabels returns every known label ordered by name.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  // CreateLabel creates a label explicitly and reports a name that is already
  // taken rather than returning the existing label.
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  // RenameLabel changes the name of an existing label.
  rpc RenameLabel(RenameLabelRequest) returns (Label);
  // DeleteLabel removes a label that is no longer attached to any item.
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty);

  // ListEfforts returns every known effort ordered by name.
  rpc ListEfforts(ListEffortsRequest) returns (ListEffortsResponse);
  // CreateEffort creates an effort explicitly and reports a name that is
  // already taken rather than returning the existing effort.
  rpc CreateEffort(CreateEffortRequest) returns (Effort);
  // RenameEffort changes the name of an existing effort.
  rpc RenameEffort(RenameEffortRequest) returns (Effort);
  // DeleteEffort removes an effort that is no longer attached to any item.
  rpc DeleteEffort(DeleteEffortRequest) returns (google.protobuf.Empty);

  // ListBlockers returns every blocker attached to the given item, ordered by
  // identifier.
  rpc ListBlockers(ListBlockersRequest) returns (ListBlockersResponse);
  // CreateBlocker attaches a new blocker to an item.
  rpc CreateBlocker(CreateBlockerRequest) returns (Blocker);
  // UpdateBlocker changes the description of an existing blocker.
  rpc UpdateBlocker(UpdateBlockerRequest) returns (Blocker);
  // DeleteBlocker removes a blocker.
  rpc DeleteBlocker(DeleteBlockerRequest) returns (google.protobuf.Empty);
}

// Label is a tag that can be attached to any number of items. Names are
// normalised to lower case with surrounding whitespace removed.
message Label {
  uint32 id = 1;
  string name = 2;
}

// Effort is a per-user named level of effort (e.g. "low", "medium", "high").
// An item carries at most one effort. Names are normalised like labels.
message Effort {
  uint32 id = 1;
  string name = 2;
}

// Blocker is a free-form description of a single blocking reason on an item.
// An item can carry several blockers. The description is stored verbatim: no
// normalisation is applied and duplicates are allowed.
message Blocker {
  uint32 id = 1;
  string description = 2;
}

// Item is a single todo item.
message Item {
  uint32 id = 1;
  string title = 2;
  string description = 3;
  bool done = 4;
  optional google.protobuf.Timestamp due_date = 5;
  optional uint32 list_id = 6;
  // priority is the manual ordering rank. Higher values sort first. It is set
  // only while done is false and the item has been triaged; untriaged items
  // carry no priority and are excluded from the default listing.
  optional double priority = 7;
  repeated Label labels = 8;
  // effort is the single effort level attached to the item, if any.
  Effort effort = 9;
  // blockers are the distinct blocking reasons attached to the item.
  repeated Blocker blockers = 10;
  // linked_items are the items linked to this one. The relationship is
  // symmetric, so a link from A to B appears on B as well.
  repeated Item linked_items = 11;
}

// ItemView narrows ListItems to a single bucket. ITEM_VIEW_UNSPECIFIED keeps
// the legacy behaviour of returning both active and completed items.
enum ItemView {
  ITEM_VIEW_UNSPECIFIED = 0;
  // UNTRIAGED: not done and carrying no manual ordering rank yet.
  ITEM_VIEW_UNTRIAGED = 1;
  // TRIAGED: not done and already placed in the manual order.
  ITEM_VIEW_TRIAGED = 2;
  // TIME_SENSITIVE: not done and carrying a due date.
  ITEM_VIEW_TIME_SENSITIVE = 3;
  // DONE: completed items.
  ITEM_VIEW_DONE = 4;
}

message ListItemsRequest {
  // labels restricts the result to items carrying every one of these labels.
  // An unknown name therefore yields no results.
  repeated string labels = 1;
  // view narrows the result to a single bucket. Leaving it unset returns both
  // the active and completed items as before.
  ItemView view = 2;
}

message ListItemsResponse {
  // active holds the items that are not yet done, in manual order.
  repeated Item active = 1;
  // completed holds the done items, most recently updated first.
  repeated Item completed = 2;
}

message CreateItemRequest {
  string title = 1;
  string description = 2;
  optional google.protobuf.Timestamp due_date = 3;
  optional uint32 list_id = 4;
  // labels are created on the fly when they do not exist yet.
  repeated string labels = 5;
  // effort is the name of an existing effort to attach to the item. An empty
  // string leaves the item without an effort. Unknown names are reported.
  optional string effort = 6;
  // link_item_ids are the ids of existing items to link to. The relationship
  // is symmetric. Unknown or cross-user ids are reported; self-links are
  // rejected.
  repeated uint32 link_item_ids = 7;
}

message MoveItemRequest {
  uint32 id = 1;
  // Exactly one anchor must be supplied.
  oneof anchor {
    // before_id places the item immediately before the identified item. The
    // anchor must already carry a priority (i.e. be triaged).
    uint32 before_id = 2;
    // after_id places the item immediately after the identified item. The
    // anchor must already carry a priority (i.e. be triaged).
    uint32 after_id = 3;
    // top assigns the highest priority, used to triage an item when no
    // prioritised anchor exists yet.
    bool top = 6;
    // bottom assigns the lowest priority, used to triage an item when no
    // prioritised anchor exists yet.
    bool bottom = 7;
  }
  // change_list reports whether list_id should be applied. It distinguishes
  // leaving the list untouched from clearing it.
  bool change_list = 4;
  // list_id is applied only when change_list is true. Leaving it unset while
  // change_list is true detaches the item from its list.
  optional uint32 list_id = 5;
}

message SetItemDoneRequest {
  uint32 id = 1;
  bool done = 2;
}

message UpdateItemLabelsRequest {
  uint32 id = 1;
  // add names labels to attach, creating any that do not exist yet.
  repeated string add = 2;
  // remove names labels to detach. Names that are not known labels are
  // ignored rather than being created only to be detached again.
  repeated string remove = 3;
}

message UpdateItemLinksRequest {
  uint32 id = 1;
  // add are the ids of items to link to. The relationship is symmetric, so
  // each link also attaches to the target item. Self-links are rejected.
  repeated uint32 add = 2;
  // remove are the ids of items to unlink. Removing a link detaches it on
  // both sides.
  repeated uint32 remove = 3;
}

message ListLabelsRequest {}

message ListLabelsResponse {
  repeated Label labels = 1;
}

message CreateLabelRequest {
  string name = 1;
}

message RenameLabelRequest {
  uint32 id = 1;
  string name = 2;
}

message DeleteLabelRequest {
  uint32 id = 1;
}

message SetItemEffortRequest {
  uint32 id = 1;
  // effort names an existing effort to attach. An empty string clears the
  // item's effort. Unknown names are reported rather than being created.
  string effort = 2;
}

message ListEffortsRequest {}

message ListEffortsResponse {
  repeated Effort efforts = 1;
}

message CreateEffortRequest {
  string name = 1;
}

message RenameEffortRequest {
  uint32 id = 1;
  string name = 2;
}

message DeleteEffortRequest {
  uint32 id = 1;
}

message ListBlockersRequest {
  uint32 item_id = 1;
}

message ListBlockersResponse {
  repeated Blocker blockers = 1;
}

message CreateBlockerRequest {
  uint32 item_id = 1;
  string description = 2;
}

message UpdateBlockerRequest {
  uint32 id = 1;
  string description = 2;
}

message DeleteBlockerRequest {
  uint32 id = 1;
}